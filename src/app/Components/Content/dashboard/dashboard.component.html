<div class="dashboard-container">
  <!-- 1. BACKDROP E DRAWER NO TOPO (Fora da toolbar para cobrir tudo) -->
  @if (isMapOpen) {
    <div class="map-backdrop" (click)="toggleMap()"></div>

    <div class="top-map-drawer" @slideInOut>
      <div class="drawer-header">
        <div class="text-center">
          <label class="pt-3 pb-2 lbl-Title">Selecione a Unidade CAS</label>
        </div>

        <button mat-icon-button (click)="toggleMap()" aria-label="Fechar">
          <mat-icon>close</mat-icon>
        </button>
      </div>

      <div class="map-content">
        <app-map-selector (selectedCas)="toggleMap()"></app-map-selector>
      </div>
    </div>
  }

  <!-- 2. TOOLBAR -->
  <mat-toolbar class="main-toolbar">
    <button mat-button (click)="sidenav.toggle()" class="nav-btn nav-title-btn" aria-label="Abrir menu">
      <mat-icon>menu</mat-icon>
    </button>

    <div class="center-nav">
      <button mat-button class="nav-title-btn cas-btn" (click)="toggleMap()" title="Trocar de CAS">
        {{ _userService.selectedEntity()?.name ?? 'Selecionar CAS' }}
        <mat-icon>{{ isMapOpen ? "expand_less" : "expand_more" }}</mat-icon>
      </button>
    </div>

    <span class="spacer"></span>

    @if (_authService.userFirebase()) {
      <span class="user-email me-3 hide-770">
        {{_authService.userFirebase()?.email}}
      </span>

      <button mat-button class="nav-btn nav-title-btn" (click)="Logout()" aria-label="Sair" title="Sair">
        <mat-icon>logout</mat-icon>
      </button>
    } @else {
      <a mat-flat-button routerLink="/login" class="btn-entrar">
        <mat-icon>login</mat-icon>
        Entrar
      </a>
    }
  </mat-toolbar>

  <!-- 3. SIDENAV E CONTEÚDO -->
  <mat-sidenav-container class="sidenav-wrapper" [hasBackdrop]="isMobile()">
    <mat-sidenav #sidenav [mode]="isMobile() ? 'over' : 'side'" [opened]="!isMobile()" class="custom-sidenav">
      <mat-nav-list class="nav-pill-list">
        <div class="text-center mt-3 mb-3">
          <img src="img/logo.png" alt="Portal CAS" class="logo-img" />
        </div>

        @for (section of menu(); track $index) {
          @if (section.title) {
            <div class="list-label">{{ section.title }}</div>
          }
          @for (item of section.items; track item.link) {
            <a mat-list-item [routerLink]="item.link" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: item.link === '/' }">
              <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
              <span matListItemTitle>{{ item.label }}</span>
            </a>
          }
        }
      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content class="content-area">
      <div class="page-container">
        <div class="centered-sheet">
          <router-outlet></router-outlet>
        </div>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
