<div #field class="dtp-field" [class.open]="open()" [class.disabled]="disabled" [class.invalid]="invalid && !open()" cdkOverlayOrigin #origin="cdkOverlayOrigin">
  <input #input [id]="inputId || id" type="text" inputmode="numeric" placeholder="dd/mm/aaaa" autocomplete="off"
    [value]="text()" [disabled]="disabled" [attr.aria-label]="ariaLabel || null"
    (input)="onType($any($event.target).value)" (blur)="onBlur()" (keydown)="onKey($event)">
  <button type="button" class="dtp-btn" [disabled]="disabled" aria-label="Abrir calendário" [attr.aria-expanded]="open()" (click)="toggle()">
    <mat-icon>calendar_month</mat-icon>
  </button>
</div>

<ng-template cdkConnectedOverlay [cdkConnectedOverlayOrigin]="origin" [cdkConnectedOverlayOpen]="open()"
  [cdkConnectedOverlayPositions]="positions" (overlayOutsideClick)="open.set(false)" (detach)="open.set(false)">
  <div class="cal" role="dialog" aria-label="Calendário" (keydown)="onKey($event)">
    <div class="cal-head">
      <button type="button" class="nav" aria-label="Mês anterior" (click)="moveMonth(-1)"><mat-icon>chevron_left</mat-icon></button>
      <span class="cal-title">{{ title() }}</span>
      <button type="button" class="nav" aria-label="Próximo mês" (click)="moveMonth(1)"><mat-icon>chevron_right</mat-icon></button>
    </div>

    <div class="grid">
      @for (w of weekdays; track $index) {
        <span class="wd">{{ w }}</span>
      }
      @for (d of days(); track d.iso) {
        <button type="button" class="day" [class.outside]="d.outside" [class.today]="d.today" [class.selected]="d.selected"
          [disabled]="d.disabled" [attr.aria-label]="d.iso" [attr.aria-pressed]="d.selected" (click)="pick(d)">{{ d.day }}</button>
      }
    </div>

    <div class="cal-foot">
      <button type="button" class="link" (click)="clear()">Limpar</button>
      <button type="button" class="link strong" (click)="today()">Hoje</button>
    </div>
  </div>
</ng-template>
